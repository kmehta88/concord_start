configuration:
  dependencies:
    - "mvn://com.walmartlabs.concord.plugins.basic:ansible-tasks:2.35.0"
  arguments:
    nested:
      name: "stranger"

flows:
  default:
    - log: "Hello, ${nested.name}!"
    
    # Correct Concord syntax for shell execution:
    - script: bash
      body: |
        pip install --user psycopg2-binary

    # Run Ansible playbook
    - task: ansible
      in:
        inventory:
          hosts:
            - "localhost"
          hostvars:
            localhost:
              ansible_connection: "local"
        playbook: "playbooks/playbook.yml"
