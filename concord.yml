configuration:
  dependencies:
    - "mvn://com.walmartlabs.concord.plugins.basic:ansible-tasks:2.35.0"
  arguments:
    nested:
      name: "stranger"

flows:
  default:
    - log: "Hello, ${nested.name}!"
    
    # 1. Install missing Python dependency
    - exec: "pip install psycopg2-binary"

    # 2. Run Ansible playbook
    - task: ansible
      in:
        inventory:
          hosts:
            - "localhost"
          hostvars:
            localhost:
              ansible_connection: "local"
        playbook: "playbooks/playbook.yml"
